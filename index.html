<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>RTEpurna</title>

<style>
body {
    margin: 0;
    background: #f2f2f2;
    overflow: hidden;
    font-family: Arial;
    transition: background 0.3s;
}

.dark {
    background: #111;
    color: white;
}

/* SETTINGS BUTTON */
#settingsBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    cursor: pointer;
    z-index: 1000;
}

/* PANEL */
#settingsPanel {
    position: absolute;
    top: 70px;
    right: 20px;
    width: 250px;
    padding: 15px;
    border-radius: 12px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(10px);
    display: none;
    z-index: 1000;
}

.dark #settingsPanel {
    background: rgba(30,30,30,0.9);
}

/* leaderboard */
#leaderboard {
    margin-top: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="settingsBtn">⚙️</div>

<div id="settingsPanel">
    <div>
        <button onclick="toggleDark()">🌙 Koyu Mod</button>
    </div>

    <div id="leaderboard">
        <b>🌍 Dünya Skoru</b>
        <div id="scores"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const settingsBtn = document.getElementById("settingsBtn");
const panel = document.getElementById("settingsPanel");
const scoresDiv = document.getElementById("scores");

settingsBtn.onclick = () => {
    panel.style.display = panel.style.display === "block" ? "none" : "block";
};

/* 🌙 DARK MODE */
function toggleDark(){
    document.body.classList.toggle("dark");
}

/* 🌍 FAKE LEADERBOARD */
let fakeScores = [
    {name:"Ali",score:120},
    {name:"Veli",score:95},
    {name:"Ayşe",score:80},
    {name:"Sen",score:0}
];

function updateBoard(currentScore){
    fakeScores[3].score = currentScore;
    fakeScores.sort((a,b)=>b.score-a.score);

    scoresDiv.innerHTML = "";
    fakeScores.forEach(s=>{
        scoresDiv.innerHTML += `${s.name}: ${s.score}<br>`;
    });
}

/* ================= OYUN ================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let karakter = {x:canvas.width/2,y:canvas.height-200,w:140,h:170};
let skor = 0;
let cisimler = [];
let aktif = true;

/* görseller */
const karakterImg=new Image();
karakterImg.src="karakter.png";
const cisimImg=new Image();
cisimImg.src="cisim.png";

/* ses */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function coin(){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(900,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(400,audioCtx.currentTime+0.1);
    g.gain.setValueAtTime(0.3,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.1);
}

/* spawn */
function spawn(){
    if(!aktif) return;
    cisimler.push({
        x:Math.random()*(canvas.width-60),
        y:-60,
        w:60,h:60,
        s:2+Math.random()*2
    });
}

/* beyaz sil */
function removeWhite(x,y,w,h){
    let img=ctx.getImageData(x,y,w,h);
    let d=img.data;
    for(let i=0;i<d.length;i+=4){
        if(d[i]>240&&d[i+1]>240&&d[i+2]>240) d[i+3]=0;
    }
    ctx.putImageData(img,x,y);
}

/* update */
function update(){
    for(let i=cisimler.length-1;i>=0;i--){
        let c=cisimler[i];
        c.y+=c.s;

        if(
            c.x<karakter.x+karakter.w &&
            c.x+c.w>karakter.x &&
            c.y<karakter.y+karakter.h &&
            c.y+c.h>karakter.y
        ){
            skor++;
            coin();
            updateBoard(skor);
            cisimler.splice(i,1);
        }

        if(c.y>canvas.height){
            aktif=false;
        }
    }
}

/* draw */
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(karakterImg,karakter.x,karakter.y,karakter.w,karakter.h);
    removeWhite(karakter.x,karakter.y,karakter.w,karakter.h);

    for(let c of cisimler){
        ctx.drawImage(cisimImg,c.x,c.y,c.w,c.h);
        removeWhite(c.x,c.y,c.w,c.h);
    }
}

/* loop */
function loop(){
    if(aktif){
        update();
        draw();
    }
    requestAnimationFrame(loop);
}

/* kontrol */
canvas.addEventListener("mousemove",(e)=>{
    karakter.x=e.clientX-karakter.w/2;
});

/* init */
updateBoard(0);
loop();
setInterval(spawn,1000);
</script>

</body>
</html>
