<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="tOI2qXvjZak4Hp1zofdp1gb1TvStyZKXJSpBwX6B-_0" />

    <title>RTEpurna</title>

    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8097201672279533"
     crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background-color: white;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }

        /* AÇILIŞ LOGO ANİMASYONU */
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            z-index: 50;
            animation: overlayFadeOut 1s ease forwards;
            animation-delay: 2.8s;
        }

        #logo {
            max-width: 40%;
            opacity: 0;
            transform: scale(0.6);
            animation: logoShow 2.5s ease-out forwards;
        }

        @keyframes logoShow {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            40% {
                opacity: 1;
                transform: scale(1.1);
            }
            70% {
                transform: scale(1.0);
            }
            100% {
                opacity: 1;
                transform: scale(1.0);
            }
        }

        @keyframes overlayFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }
    </style>
</head>

<body>

    <!-- Açılış logosu -->
    <div id="overlay">
        <img id="logo" src="logo.png" alt="logo">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Karakter ve değişkenler
        let karakter = { x: canvas.width / 2, y: canvas.height - 220, width: 120, height: 150 };
        let skor = 0;
        let cisimler = [];
        let oyunAktif = true;
        let yeniCisimInterval = null;

        const karakterImg = new Image();
        karakterImg.src = 'karakter.png';

        const cisimImg = new Image();
        cisimImg.src = 'cisim.png';

        function yeniCisim() {
            cisimler.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                width: 60,
                height: 60,
                speed: 2 + Math.random() * 2
            });
        }

        function cisimleriGuncelle() {
            for (let i = cisimler.length - 1; i >= 0; i--) {
                cisimler[i].y += cisimler[i].speed;

                // Çarpışma
                if (
                    cisimler[i].x < karakter.x + karakter.width &&
                    cisimler[i].x + cisimler[i].width > karakter.x &&
                    cisimler[i].y < karakter.y + karakter.height &&
                    cisimler[i].y + cisimler[i].height > karakter.y
                ) {
                    skor++;
                    cisimler.splice(i, 1);
                    continue;
                }

                // Ekranın dışına çıkarsa sil
                if (cisimler[i].y > canvas.height + 100) {
                    cisimler.splice(i, 1);
                }
            }
        }

        function oyunCiz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(karakterImg, karakter.x, karakter.y, karakter.width, karakter.height);

            for (let c of cisimler) {
                ctx.drawImage(cisimImg, c.x, c.y, c.width, c.height);
            }

            // Skor
            ctx.fillStyle = 'black';
            ctx.font = '28px Arial';
            ctx.fillText('Skor: ' + skor, 20, 40);
        }

        function oyunDongusu() {
            if (!oyunAktif) return;
            cisimleriGuncelle();
            oyunCiz();
            requestAnimationFrame(oyunDongusu);
        }

        function baslat() {
            oyunDongusu();
            yeniCisimInterval = setInterval(yeniCisim, 1000);
        }

        // Mouse kontrol
        canvas.addEventListener('mousemove', (e) => {
            if (!oyunAktif) return;
            karakter.x = e.clientX - karakter.width / 2;
        });

        // Mobil kontrol
        canvas.addEventListener('touchmove', (e) => {
            if (!oyunAktif) return;
            e.preventDefault();
            karakter.x = e.touches[0].clientX - karakter.width / 2;
        }, { passive: false });

        // Ekran boyutu değişince düzelt
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            karakter.y = canvas.height - 220;
        });

        // Açılış animasyonundan sonra oyun başlasın
        setTimeout(baslat, 3000);
    </script>

</body>
</html>
