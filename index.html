<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="tOI2qXvjZak4Hp1zofdp1gb1TvStyZKXJSpBwX6B-_0" />
    <title>RTEpurna</title>

    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8097201672279533"
     crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background-color: white;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }

        /* ==============================
           YENİ LÜKS AÇILIŞ EFEKTİ
        ============================== */
        #overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #ffffff 0%, #f0f0f0 40%, #dcdcdc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            overflow: hidden;
            animation: fadeOut 1.2s ease forwards;
            animation-delay: 3s;
        }

        #logo {
            width: 320px;
            opacity: 0;
            transform: scale(0.8);
            filter: blur(10px);
            animation: logoReveal 2.5s ease forwards;
        }

        #overlay::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                120deg,
                transparent 30%,
                rgba(255,255,255,0.6),
                transparent 70%
            );
            animation: shine 2.5s ease;
        }

        @keyframes logoReveal {
            0% {
                opacity: 0;
                transform: scale(0.8);
                filter: blur(10px);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(20deg);
            }
            100% {
                transform: translateX(100%) rotate(20deg);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>

<body>

    <!-- Açılış logosu -->
    <div id="overlay">
        <img id="logo" src="logo.png" alt="logo">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        let audioCtx;
        let openingBuffer = null;
        window.__openingPlayed = false;

        async function loadOpeningSound() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                const delay = audioCtx.createDelay();
                delay.delayTime.value = 0.25;

                const feedback = audioCtx.createGain();
                feedback.gain.value = 0.45;

                const outputGain = audioCtx.createGain();
                outputGain.gain.value = 1.1;

                delay.connect(feedback);
                feedback.connect(delay);

                delay.connect(outputGain);
                outputGain.connect(audioCtx.destination);

                const response = await fetch("opening.mp3");
                const arrayBuffer = await response.arrayBuffer();
                openingBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                window.playOpeningWithEcho = function () {
                    if (!openingBuffer || window.__openingPlayed) return;
                    try {
                        const source = audioCtx.createBufferSource();
                        source.buffer = openingBuffer;
                        source.connect(audioCtx.destination);
                        source.connect(delay);
                        source.start(0);
                        window.__openingPlayed = true;
                    } catch (e) {
                        console.warn("Opening sound play error:", e);
                    }
                };
            } catch (e) {
                console.warn("Audio loading failed:", e);
            }
        }

        loadOpeningSound();

        setTimeout(() => {
            if (window.playOpeningWithEcho) {
                try { window.playOpeningWithEcho(); } catch(e) {}
            }
        }, 500);

        function unlockAudioAndPlay() {
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume().catch(()=>{});
            }
            if (window.playOpeningWithEcho && !window.__openingPlayed) {
                try { window.playOpeningWithEcho(); } catch(e) {}
            }
            document.removeEventListener('click', unlockAudioAndPlay);
            document.removeEventListener('touchstart', unlockAudioAndPlay);
            document.removeEventListener('keydown', unlockAudioAndPlay);
        }

        document.addEventListener('click', unlockAudioAndPlay, { once: true });
        document.addEventListener('touchstart', unlockAudioAndPlay, { once: true });
        document.addEventListener('keydown', unlockAudioAndPlay, { once: true });

        setTimeout(() => {
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume().then(() => {
                    if (window.playOpeningWithEcho && !window.__openingPlayed) {
                        try { window.playOpeningWithEcho(); } catch(e) {}
                    }
                }).catch(()=>{});
            }
        }, 1200);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let karakter = { x: canvas.width / 2, y: canvas.height - 220, width: 120, height: 150 };
        let skor = 0;
        let cisimler = [];
        let oyunAktif = true;
        let yeniCisimInterval = null;

        const karakterImg = new Image();
        karakterImg.src = 'karakter.png';

        const cisimImg = new Image();
        cisimImg.src = 'cisim.png';

        function yeniCisim() {
            cisimler.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                width: 60,
                height: 60,
                speed: 2 + Math.random() * 2
            });
        }

        function cisimleriGuncelle() {
            for (let i = cisimler.length - 1; i >= 0; i--) {
                cisimler[i].y += cisimler[i].speed;

                if (
                    cisimler[i].x < karakter.x + karakter.width &&
                    cisimler[i].x + cisimler[i].width > karakter.x &&
                    cisimler[i].y < karakter.y + karakter.height &&
                    cisimler[i].y + cisimler[i].height > karakter.y
                ) {
                    skor++;
                    cisimler.splice(i, 1);
                    continue;
                }

                if (cisimler[i].y > canvas.height + 100) {
                    cisimler.splice(i, 1);
                }
            }
        }

        function oyunCiz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(karakterImg, karakter.x, karakter.y, karakter.width, karakter.height);

            for (let c of cisimler) {
                ctx.drawImage(cisimImg, c.x, c.y, c.width, c.height);
            }

            ctx.fillStyle = 'black';
            ctx.font = '28px Arial';
            ctx.fillText('Skor: ' + skor, 20, 40);
        }

        function oyunDongusu() {
            if (!oyunAktif) return;
            cisimleriGuncelle();
            oyunCiz();
            requestAnimationFrame(oyunDongusu);
        }

        function baslat() {
            oyunDongusu();
            if (yeniCisimInterval) clearInterval(yeniCisimInterval);
            yeniCisimInterval = setInterval(yeniCisim, 1000);
        }

        canvas.addEventListener('mousemove', (e) => {
            if (!oyunAktif) return;
            karakter.x = e.clientX - karakter.width / 2;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!oyunAktif) return;
            e.preventDefault();
            karakter.x = e.touches[0].clientX - karakter.width / 2;
        }, { passive: false });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            karakter.y = canvas.height - 220;
        });

        setTimeout(baslat, 3300);
    </script>

</body>
</html>
