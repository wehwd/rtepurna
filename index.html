<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>RTEpurna</title>

<style>
body {
    margin: 0;
    background: #f2f2f2;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ffffff, #eaeaea, #dcdcdc);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    animation: fadeOut 1.2s ease forwards;
    animation-delay: 3s;
}

#logo {
    width: 1000px;
    opacity: 0;
    transform: scale(0.85);
    filter: blur(12px);
    mix-blend-mode: multiply;
    animation: logoIn 2.2s ease forwards;
}

@keyframes logoIn {
    0% {opacity:0; transform:scale(0.85); filter:blur(12px);}
    100% {opacity:1; transform:scale(1); filter:blur(0);}
}

@keyframes fadeOut {
    to {opacity:0; pointer-events:none;}
}

canvas {
    position: absolute;
    inset: 0;
}

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 12px 20px;
    border-radius: 14px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.35);
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    font-size: 18px;
    color: #111;
}
</style>
</head>

<body>

<div id="overlay">
    <img id="logo" src="logo.png">
</div>

<div id="ui">Skor: 0</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* ✨ BACKGROUND PARTICLES */
let particles = [];
for(let i=0;i<80;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*2 + 1,
        speedY: Math.random()*0.5 + 0.2,
        opacity: Math.random()
    });
}

function drawParticles(){
    for(let p of particles){
        ctx.beginPath();
        ctx.fillStyle = "rgba(0,0,0,"+p.opacity*0.15+")";
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();

        p.y += p.speedY;
        if(p.y > canvas.height){
            p.y = 0;
            p.x = Math.random()*canvas.width;
        }
    }
}

/* 💥 EFFECT */
let effects = [];

function createEffect(x,y){
    for(let i=0;i<12;i++){
        effects.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4,
            life:30
        });
    }
}

function drawEffects(){
    for(let i=effects.length-1;i>=0;i--){
        let e = effects[i];
        ctx.beginPath();
        ctx.fillStyle="rgba(0,0,0,0.25)";
        ctx.arc(e.x,e.y,3,0,Math.PI*2);
        ctx.fill();

        e.x+=e.vx;
        e.y+=e.vy;
        e.life--;

        if(e.life<=0){
            effects.splice(i,1);
        }
    }
}

/* 💰 COIN SOUND */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playCoin(){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.12);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
}

/* 🎮 GAME */
let karakter = { x: canvas.width / 2, y: canvas.height - 220, width: 140, height: 170 };
let skor = 0;
let cisimler = [];

const karakterImg = new Image();
karakterImg.src = 'karakter.png';

const cisimImg = new Image();
cisimImg.src = 'cisim.png';

function yeniCisim(){
    cisimler.push({
        x: Math.random() * (canvas.width - 60),
        y: -60,
        width: 60,
        height: 60,
        speed: 2 + Math.random()*2
    });
}

/* 🧼 REMOVE WHITE */
function removeWhite(ctx, x, y, w, h){
    const imgData = ctx.getImageData(x, y, w, h);
    const data = imgData.data;

    for(let i=0;i<data.length;i+=4){
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];

        if(r>240 && g>240 && b>240){
            data[i+3] = 0;
        }
    }
    ctx.putImageData(imgData, x, y);
}

function cisimleriGuncelle(){
    for (let i = cisimler.length - 1; i >= 0; i--) {
        cisimler[i].y += cisimler[i].speed;

        if (
            cisimler[i].x < karakter.x + karakter.width &&
            cisimler[i].x + cisimler[i].width > karakter.x &&
            cisimler[i].y < karakter.y + karakter.height &&
            cisimler[i].y + cisimler[i].height > karakter.y
        ) {
            skor++;
            ui.innerText = "Skor: " + skor;

            createEffect(cisimler[i].x, cisimler[i].y);
            playCoin();

            cisimler.splice(i, 1);
            continue;
        }

        if (cisimler[i].y > canvas.height + 100) {
            cisimler.splice(i, 1);
        }
    }
}

function oyunCiz(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawParticles();
    drawEffects();

    ctx.drawImage(karakterImg, karakter.x, karakter.y, karakter.width, karakter.height);
    removeWhite(ctx, karakter.x, karakter.y, karakter.width, karakter.height);

    for (let c of cisimler) {
        ctx.drawImage(cisimImg, c.x, c.y, c.width, c.height);
        removeWhite(ctx, c.x, c.y, c.width, c.height);
    }
}

function oyunDongusu(){
    cisimleriGuncelle();
    oyunCiz();
    requestAnimationFrame(oyunDongusu);
}

function baslat(){
    oyunDongusu();
    setInterval(yeniCisim, 1000);
}

canvas.addEventListener('mousemove', (e)=>{
    karakter.x = e.clientX - karakter.width/2;
});

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    karakter.y = canvas.height - 220;
});

setTimeout(baslat, 3000);
</script>

</body>
</html>
