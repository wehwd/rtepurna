<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>RTEpurna</title>

<style>
body {
    margin: 0;
    background: #f2f2f2;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ffffff, #eaeaea, #dcdcdc);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    animation: fadeOut 1.2s ease forwards;
    animation-delay: 3s;
}

#logo {
    width: 1000px;
    opacity: 0;
    transform: scale(0.85);
    filter: blur(12px);
    mix-blend-mode: multiply;
    animation: logoIn 2.2s ease forwards;
}

@keyframes logoIn {
    0% {opacity:0; transform:scale(0.85); filter:blur(12px);}
    100% {opacity:1; transform:scale(1); filter:blur(0);}
}

@keyframes fadeOut {
    to {opacity:0; pointer-events:none;}
}

canvas {
    position: absolute;
    inset: 0;
}

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 12px 20px;
    border-radius: 14px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.35);
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    font-size: 18px;
}

#gameover {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(255,255,255,0.7);
    font-size: 28px;
}
</style>
</head>

<body>

<div id="overlay">
    <img id="logo" src="logo.png">
</div>

<div id="ui">Skor: 0 | Rekor: 0</div>

<div id="gameover">
    <div>OYUN BİTTİ</div>
    <div style="font-size:18px;margin-top:10px;">R tuşuna basarak yeniden başla</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const gameoverDiv = document.getElementById('gameover');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* High score */
let highScore = localStorage.getItem("highscore") || 0;

/* particles */
let particles = [];
for(let i=0;i<80;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*2+1,
        speedY: Math.random()*0.5+0.2,
        opacity: Math.random()
    });
}

function drawParticles(){
    for(let p of particles){
        ctx.beginPath();
        ctx.fillStyle = "rgba(0,0,0,"+p.opacity*0.15+")";
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        p.y+=p.speedY;
        if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width;}
    }
}

/* effects */
let effects=[];
function createEffect(x,y){
    for(let i=0;i<12;i++){
        effects.push({x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:30});
    }
}
function drawEffects(){
    for(let i=effects.length-1;i>=0;i--){
        let e=effects[i];
        ctx.beginPath();
        ctx.arc(e.x,e.y,3,0,Math.PI*2);
        ctx.fill();
        e.x+=e.vx; e.y+=e.vy; e.life--;
        if(e.life<=0) effects.splice(i,1);
    }
}

/* sound */
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
function playCoin(){
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(900,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(400,audioCtx.currentTime+0.12);
    g.gain.setValueAtTime(0.3,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.12);
}

/* game */
let karakter, skor, cisimler, oyunAktif;

const karakterImg=new Image();
karakterImg.src='karakter.png';
const cisimImg=new Image();
cisimImg.src='cisim.png';

function resetGame(){
    karakter={x:canvas.width/2,y:canvas.height-220,width:140,height:170};
    skor=0;
    cisimler=[];
    oyunAktif=true;
    gameoverDiv.style.display="none";
}

function yeniCisim(){
    if(!oyunAktif) return;
    cisimler.push({
        x:Math.random()*(canvas.width-60),
        y:-60,
        width:60,
        height:60,
        speed:2+Math.random()*2
    });
}

function removeWhite(ctx,x,y,w,h){
    let img=ctx.getImageData(x,y,w,h);
    let d=img.data;
    for(let i=0;i<d.length;i+=4){
        if(d[i]>240 && d[i+1]>240 && d[i+2]>240){
            d[i+3]=0;
        }
    }
    ctx.putImageData(img,x,y);
}

function update(){
    for(let i=cisimler.length-1;i>=0;i--){
        let c=cisimler[i];
        c.y+=c.speed;

        if(c.y>canvas.height){
            oyunAktif=false;
            gameoverDiv.style.display="flex";
        }

        if(
            c.x<karakter.x+karakter.width &&
            c.x+c.width>karakter.x &&
            c.y<karakter.y+karakter.height &&
            c.y+c.height>karakter.y
        ){
            skor++;
            if(skor>highScore){
                highScore=skor;
                localStorage.setItem("highscore",highScore);
            }

            createEffect(c.x,c.y);
            playCoin();

            cisimler.splice(i,1);
        }
    }
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawParticles();
    drawEffects();

    ctx.drawImage(karakterImg,karakter.x,karakter.y,karakter.width,karakter.height);
    removeWhite(ctx,karakter.x,karakter.y,karakter.width,karakter.height);

    for(let c of cisimler){
        ctx.drawImage(cisimImg,c.x,c.y,c.width,c.height);
        removeWhite(ctx,c.x,c.y,c.width,c.height);
    }

    ui.innerText="Skor: "+skor+" | Rekor: "+highScore;
}

function loop(){
    if(oyunAktif){
        update();
        draw();
    }
    requestAnimationFrame(loop);
}

window.addEventListener("keydown",(e)=>{
    if(e.key==="r") resetGame();
});

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

resetGame();
loop();
setInterval(yeniCisim,1000);
</script>

</body>
</html>
