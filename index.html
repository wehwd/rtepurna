<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="tOI2qXvjZak4Hp1zofdp1gb1TvStyZKXJSpBwX6B-_0" />
    <title>RTEpurna</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8097201672279533"
     crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background-color: #f5f5f5;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        /* =========================
           ELİT AÇILIŞ EFEKTİ
        ========================= */
        #overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ffffff, #eaeaea, #dcdcdc);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeOut 1.2s ease forwards;
            animation-delay: 3s;
        }

        #logo {
            width: 260px;
            opacity: 0;
            transform: scale(0.85);
            filter: blur(12px);
            animation: logoIn 2.2s ease forwards;
        }

        /* IŞIK GEÇİŞİ */
        #overlay::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                120deg,
                transparent 30%,
                rgba(255,255,255,0.7),
                transparent 70%
            );
            animation: shine 2.2s ease;
        }

        @keyframes logoIn {
            0% {
                opacity: 0;
                transform: scale(0.85);
                filter: blur(12px);
            }
            60% {
                opacity: 1;
                transform: scale(1.05);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes shine {
            0% {
                transform: translateX(-120%) rotate(20deg);
            }
            100% {
                transform: translateX(120%) rotate(20deg);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }

        /* Hafif premium dokunuş */
        canvas {
            filter: contrast(1.05) saturate(1.05);
        }
    </style>
</head>

<body>

    <div id="overlay">
        <img id="logo" src="logo.png" alt="logo">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let karakter = { x: canvas.width / 2, y: canvas.height - 220, width: 120, height: 150 };
        let skor = 0;
        let cisimler = [];
        let oyunAktif = true;
        let yeniCisimInterval = null;

        const karakterImg = new Image();
        karakterImg.src = 'karakter.png';

        const cisimImg = new Image();
        cisimImg.src = 'cisim.png';

        function yeniCisim() {
            cisimler.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                width: 60,
                height: 60,
                speed: 2 + Math.random() * 2
            });
        }

        function cisimleriGuncelle() {
            for (let i = cisimler.length - 1; i >= 0; i--) {
                cisimler[i].y += cisimler[i].speed;

                if (
                    cisimler[i].x < karakter.x + karakter.width &&
                    cisimler[i].x + cisimler[i].width > karakter.x &&
                    cisimler[i].y < karakter.y + karakter.height &&
                    cisimler[i].y + cisimler[i].height > karakter.y
                ) {
                    skor++;
                    cisimler.splice(i, 1);
                    continue;
                }

                if (cisimler[i].y > canvas.height + 100) {
                    cisimler.splice(i, 1);
                }
            }
        }

        function oyunCiz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(karakterImg, karakter.x, karakter.y, karakter.width, karakter.height);

            for (let c of cisimler) {
                ctx.drawImage(cisimImg, c.x, c.y, c.width, c.height);
            }

            ctx.fillStyle = '#111';
            ctx.font = '28px Arial';
            ctx.fillText('Skor: ' + skor, 20, 40);
        }

        function oyunDongusu() {
            if (!oyunAktif) return;
            cisimleriGuncelle();
            oyunCiz();
            requestAnimationFrame(oyunDongusu);
        }

        function baslat() {
            oyunDongusu();
            if (yeniCisimInterval) clearInterval(yeniCisimInterval);
            yeniCisimInterval = setInterval(yeniCisim, 1000);
        }

        canvas.addEventListener('mousemove', (e) => {
            if (!oyunAktif) return;
            karakter.x = e.clientX - karakter.width / 2;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!oyunAktif) return;
            e.preventDefault();
            karakter.x = e.touches[0].clientX - karakter.width / 2;
        }, { passive: false });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            karakter.y = canvas.height - 220;
        });

        setTimeout(baslat, 3000);
    </script>

</body>
</html>
