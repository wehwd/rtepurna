<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="tOI2qXvjZak4Hp1zofdp1gb1TvStyZKXJSpBwX6B-_0" />
    <title>RTEpurna</title>

    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8097201672279533"
     crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background-color: white;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }

        /* ----------------------------------------
           LOGO AÇILIŞ EFEKTİ + SES SENKRON GLITCH
        ---------------------------------------- */
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            z-index: 999;
            animation: overlayFadeOut 1s ease forwards;
            animation-delay: 3.2s;
        }

        #logo {
            max-width: 60%;         /* Daha büyük logo */
            opacity: 0;
            transform: scale(0.6);
            animation: logoMainAnim 3s ease-out forwards;
        }

        /* SES PATLAMASINA GÖRE GLITCH + BÜYÜME */
        @keyframes logoMainAnim {
            0%   { opacity: 0; transform: scale(0.6); filter: blur(0px); }
            20%  { opacity: 1; transform: scale(0.9); }
            45%  { transform: scale(1.0); }

            /* Yankı başladığı an – GLITCH */
            60%  { transform: scale(1.8) skewX(3deg); filter: blur(2px) brightness(120%); }
            70%  { transform: scale(2.2) skewX(-3deg); filter: blur(1px); }
            85%  { transform: scale(2.6); filter: blur(3px) brightness(150%); }

            100% { opacity: 1; transform: scale(3.0); filter: blur(6px); }
        }

        @keyframes overlayFadeOut {
            from { opacity: 1; }
            to   { opacity: 0; pointer-events: none; }
        }
    </style>
</head>

<body>

    <!-- Açılış logosu -->
    <div id="overlay">
        <img id="logo" src="logo.png" alt="logo">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /* ============================================================
           AÇILIŞ SESİ (YANKI + DELAY + GLITCH MOMENT SENKRON)
        ============================================================ */
        let audioCtx;
        let openingBuffer = null;
        window.__openingPlayed = false; // tekrar çalmayı engellemek için bayrak

        async function loadOpeningSound() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                /* Yankı – Echo efekti */
                const delay = audioCtx.createDelay();
                delay.delayTime.value = 0.25;

                const feedback = audioCtx.createGain();
                feedback.gain.value = 0.45;

                const outputGain = audioCtx.createGain();
                outputGain.gain.value = 1.1;

                // echo feedback loop
                delay.connect(feedback);
                feedback.connect(delay);

                // delay -> output
                delay.connect(outputGain);
                outputGain.connect(audioCtx.destination);

                /* MP3 dosyasını yükle */
                const response = await fetch("opening.mp3");
                const arrayBuffer = await response.arrayBuffer();
                openingBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                window.playOpeningWithEcho = function () {
                    if (!openingBuffer || window.__openingPlayed) return;
                    try {
                        const source = audioCtx.createBufferSource();
                        source.buffer = openingBuffer;
                        // connect source both to direct output and to delay for fullness
                        source.connect(audioCtx.destination);
                        source.connect(delay);
                        source.start(0);
                        window.__openingPlayed = true;
                    } catch (e) {
                        // sessizce yakala
                        console.warn("Opening sound play error:", e);
                    }
                };
            } catch (e) {
                console.warn("Audio loading failed:", e);
            }
        }

        /* Ses dosyasını hazırla */
        loadOpeningSound();

        /* Normalde bu zamanlama ile deniyoruz (tarayıcı izin verirse) */
        setTimeout(() => {
            if (window.playOpeningWithEcho) {
                // Eğer otomatik engellenirse, unlock logic ile tetiklenecek
                try { window.playOpeningWithEcho(); } catch(e) {}
            }
        }, 500);

        /* ------------------------------------------------------------
           Autoplay engelini aşma: kullanıcı etkileşimi ile açma (görünmez)
           ------------------------------------------------------------ */
        function unlockAudioAndPlay() {
            // resume audio context if suspended
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume().catch(()=>{});
            }
            // play if ready
            if (window.playOpeningWithEcho && !window.__openingPlayed) {
                try { window.playOpeningWithEcho(); } catch(e) {}
            }
            // remove listeners after first interaction
            document.removeEventListener('click', unlockAudioAndPlay);
            document.removeEventListener('touchstart', unlockAudioAndPlay);
            document.removeEventListener('keydown', unlockAudioAndPlay);
        }

        // Add interaction listeners (first click/tap/keydown will unlock audio)
        document.addEventListener('click', unlockAudioAndPlay, { once: true });
        document.addEventListener('touchstart', unlockAudioAndPlay, { once: true });
        document.addEventListener('keydown', unlockAudioAndPlay, { once: true });

        // Ayrıca kısa bir süre sonra otomatik bir deneme daha (bazı tarayıcılar izin veriyor)
        setTimeout(() => {
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume().then(() => {
                    if (window.playOpeningWithEcho && !window.__openingPlayed) {
                        try { window.playOpeningWithEcho(); } catch(e) {}
                    }
                }).catch(()=>{});
            }
        }, 1200);

        /* ============================================================
           OYUN – Hiçbir Kod Silinmedi, Aynen Kaldı
        ============================================================ */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let karakter = { x: canvas.width / 2, y: canvas.height - 220, width: 120, height: 150 };
        let skor = 0;
        let cisimler = [];
        let oyunAktif = true;
        let yeniCisimInterval = null;

        const karakterImg = new Image();
        karakterImg.src = 'karakter.png';

        const cisimImg = new Image();
        cisimImg.src = 'cisim.png';

        function yeniCisim() {
            cisimler.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                width: 60,
                height: 60,
                speed: 2 + Math.random() * 2
            });
        }

        function cisimleriGuncelle() {
            for (let i = cisimler.length - 1; i >= 0; i--) {
                cisimler[i].y += cisimler[i].speed;

                if (
                    cisimler[i].x < karakter.x + karakter.width &&
                    cisimler[i].x + cisimler[i].width > karakter.x &&
                    cisimler[i].y < karakter.y + karakter.height &&
                    cisimler[i].y + cisimler[i].height > karakter.y
                ) {
                    skor++;
                    cisimler.splice(i, 1);
                    continue;
                }

                if (cisimler[i].y > canvas.height + 100) {
                    cisimler.splice(i, 1);
                }
            }
        }

        function oyunCiz() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(karakterImg, karakter.x, karakter.y, karakter.width, karakter.height);

            for (let c of cisimler) {
                ctx.drawImage(cisimImg, c.x, c.y, c.width, c.height);
            }

            ctx.fillStyle = 'black';
            ctx.font = '28px Arial';
            ctx.fillText('Skor: ' + skor, 20, 40);
        }

        function oyunDongusu() {
            if (!oyunAktif) return;
            cisimleriGuncelle();
            oyunCiz();
            requestAnimationFrame(oyunDongusu);
        }

        function baslat() {
            oyunDongusu();
            if (yeniCisimInterval) clearInterval(yeniCisimInterval);
            yeniCisimInterval = setInterval(yeniCisim, 1000);
        }

        canvas.addEventListener('mousemove', (e) => {
            if (!oyunAktif) return;
            karakter.x = e.clientX - karakter.width / 2;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!oyunAktif) return;
            e.preventDefault();
            karakter.x = e.touches[0].clientX - karakter.width / 2;
        }, { passive: false });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            karakter.y = canvas.height - 220;
        });

        /* Açılış animasyonu bittiğinde oyun başlıyor */
        setTimeout(baslat, 3300);
    </script>

</body>
</html>
